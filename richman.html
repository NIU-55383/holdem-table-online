<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>大富翁 · 晴湾 / Richman · Sunny Bay</title><link rel="stylesheet" href="richman.css"><link rel="stylesheet" href="game-ui.css"></head>
<body>
<header class="rich-header"><a href="index.html" class="icon-button" title="返回桌游小馆 / Back to club" aria-label="返回桌游小馆 / Back to club"><i data-lucide="arrow-left"></i></a><div class="rich-title"><strong>大富翁 <small>Richman</small></strong><span>晴湾 / Sunny Bay</span></div><span id="connection" role="status">连接中 / Connecting</span><button data-modal="rules" class="icon-button" title="规则 / Rules" aria-label="规则 / Rules"><i data-lucide="book-open"></i></button></header>
<main class="rich-layout">
  <section class="rich-play">
    <div id="calendar" class="calendar"><span>晴湾 / Sunny Bay</span><span>虚拟游戏币 / Game currency</span></div>
    <div id="board" class="board-host"></div>
    <div id="turnStatus" class="turn-status" role="status">大富翁 <small>Richman</small></div>
    <section id="actions" class="action-strip" aria-label="回合操作 / Turn actions" hidden></section>
    <div id="gameTools" class="game-tools" hidden><button data-modal="stocks"><i data-lucide="chart-no-axes-combined"></i><span>股票<small>Stocks</small></span></button><button data-modal="lottery"><i data-lucide="ticket"></i><span>彩票<small>Lottery</small></span></button><button data-modal="properties"><i data-lucide="house"></i><span>地产<small>Property</small></span></button><button id="autoBtn"><i data-lucide="bot"></i><span>托管<small>Auto</small></span></button></div>
    <section id="handSection" class="hand-section" hidden><div class="section-label"><h2>我的卡片 <small>My Cards</small></h2><span id="points"></span></div><div id="hand" class="hand"></div></section>
    <section id="players" class="players" aria-label="玩家 / Players"></section>
  </section>
  <aside class="rich-sidebar">
    <section id="setup"><h1>开始游戏 <small>Start a game</small></h1><div class="identity"><div id="avatarPicker"></div><label>名字 / Name<input id="playerName" maxlength="18" autocomplete="nickname"></label></div>
      <div class="setup-fields"><label>人数 / Players<select id="playerCount"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>总资金 / Funds<select id="funds"><option value="20000">20,000</option><option value="50000" selected>50,000</option><option value="100000">100,000</option></select></label><label>结算 / Finish<select id="days"><option value="0">破产淘汰 / Last solvent</option><option value="30" selected>30 天 / Days</option><option value="60">60 天 / Days</option><option value="90">90 天 / Days</option></select></label><label>机器人 / AI<select id="difficulty"><option value="easy">入门 / Easy</option><option value="normal" selected>标准 / Standard</option><option value="hard">进阶 / Advanced</option></select></label></div>
      <div class="start-options"><button id="soloBtn" class="primary"><i data-lucide="play"></i><span>与机器人开局<small>Play with bots</small></span></button><button id="createBtn"><i data-lucide="users"></i><span>创建联机房间<small>Create a room</small></span></button></div>
      <form id="joinForm" class="join-form"><label>加入好友房间 / Join a room<input id="roomInput" maxlength="6" placeholder="房间号 / Room code" autocomplete="off" autocapitalize="characters"></label><button aria-label="加入 / Join" title="加入 / Join"><i data-lucide="log-in"></i></button></form>
    </section>
    <section id="roomPanel" hidden><div class="room-heading"><div><small>房间 / Room</small><strong id="roomCode"></strong></div><button id="copyBtn" class="icon-button" title="复制邀请 / Copy invite" aria-label="复制邀请 / Copy invite"><i data-lucide="copy"></i></button><button id="leaveBtn" class="icon-button" title="离开 / Leave" aria-label="离开 / Leave"><i data-lucide="log-out"></i></button></div><div id="lobby"></div>
      <section class="chat-section"><h2>聊天 <small>Chat</small></h2><div id="messages" class="messages" aria-live="polite"></div><form id="chatForm"><input id="chatText" maxlength="160" placeholder="消息 / Message" aria-label="消息 / Message" autocomplete="off"><button aria-label="发送 / Send" title="发送 / Send"><i data-lucide="send"></i></button></form></section>
      <details class="log-section" open><summary>游戏记录 / Game Log</summary><ol id="gameLog"></ol></details>
    </section>
  </aside>
</main><div id="toast" class="toast" role="alert" hidden></div>
<dialog id="richDialog"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-button" aria-label="关闭 / Close" title="关闭 / Close"><i data-lucide="x"></i></button></div><div id="dialogContent"></div></dialog>
<script src="vendor/lucide.min.js"></script><script src="avatar-data.js"></script><script src="social-data.js"></script><script src="game-ui.js"></script><script src="richman-data.js"></script><script src="richman-board.js"></script><script src="richman.js"></script>
</body></html>
